<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#080504;image-rendering:pixelated;-webkit-font-smoothing:none;font-smooth:never;
    --gold-hi:#ebbf90;--gold:#c68f66;--gold-mid:#9a6651;--gold-dk:#4e2f24;--ink:#000000;
    --panel:#231815;--panel-hi:#33231d;--panel-dk:#150e0c;--field:#0f0a09;
    --text:#ebbf90;--dim:#a87f68;}
  *{box-sizing:border-box}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-hi)}
  input::placeholder{color:#6b4d40}
  ::selection{background:var(--gold-mid);color:var(--ink)}
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 32px;background:#080504;font-family:'Silkscreen',monospace">
  <div id="login-panel" ref="{{ snapRef }}" style="position:relative">
    <div style="position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 4px, rgba(0,0,0,0) 4px 8px)"></div>

    <!-- top crest -->
    <div style="position:absolute;top:-46px;left:calc(50% - 24px);transform:scale(2.5);transform-origin:50% 100%;width:48px;height:20px;z-index:4">
        <div style="position:absolute;left:20px;top:0px;width:8px;height:4px;background:var(--gold-hi)"></div>
        <div style="position:absolute;left:16px;top:4px;width:16px;height:4px;background:var(--gold)"></div>
        <div style="position:absolute;left:4px;top:8px;width:8px;height:4px;background:var(--gold)"></div>
        <div style="position:absolute;left:20px;top:8px;width:8px;height:4px;background:var(--gold-hi)"></div>
        <div style="position:absolute;left:36px;top:8px;width:8px;height:4px;background:var(--gold)"></div>
        <div style="position:absolute;left:0px;top:12px;width:8px;height:4px;background:var(--gold-mid)"></div>
        <div style="position:absolute;left:16px;top:12px;width:16px;height:4px;background:var(--gold)"></div>
        <div style="position:absolute;left:40px;top:12px;width:8px;height:4px;background:var(--gold-mid)"></div>
        <div style="position:absolute;left:8px;top:16px;width:8px;height:4px;background:var(--gold-mid)"></div>
        <div style="position:absolute;left:20px;top:16px;width:8px;height:4px;background:var(--gold)"></div>
        <div style="position:absolute;left:32px;top:16px;width:8px;height:4px;background:var(--gold-mid)"></div>
    </div>

    <!-- panel -->
    <div style="position:relative;width:520px;padding:44px 44px 40px;background:var(--panel);box-shadow:inset 0 4px 0 var(--panel-hi), inset 0 -4px 0 var(--panel-dk), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-mid), 0 0 0 12px var(--gold-dk), 0 0 0 16px var(--ink), 0 24px 0 rgba(0,0,0,.35)">

      <div style="position:absolute;left:-8px;top:-8px;width:32px;height:32px;border-top:6px solid var(--gold);border-left:6px solid var(--gold)"></div>
      <div style="position:absolute;right:-8px;top:-8px;width:32px;height:32px;border-top:6px solid var(--gold);border-right:6px solid var(--gold)"></div>
      <div style="position:absolute;left:-8px;bottom:-8px;width:32px;height:32px;border-bottom:6px solid var(--gold);border-left:6px solid var(--gold)"></div>
      <div style="position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;border-bottom:6px solid var(--gold);border-right:6px solid var(--gold)"></div>

      <div style="display:flex;flex-direction:column;gap:26px">

        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--gold-hi);text-shadow:0 3px 0 rgba(0,0,0,.45)">LOGIN</span>
          <div style="position:relative;display:flex">
            <input type="{{ emailType }}" placeholder="hero@realm.net" value="{{ email }}" onChange="{{ onEmail }}" style="width:100%;height:52px;padding:0 68px 0 16px;border:0;outline:0;background:var(--field);color:var(--text);font-family:'Silkscreen',monospace;font-size:19px;box-shadow:inset 0 0 0 4px var(--ink), inset 0 4px 0 8px rgba(0,0,0,.35), 0 0 0 4px var(--gold-mid)"></input>
            <div onClick="{{ toggleShowEmail }}" title="Show login" style="position:absolute;right:8px;top:8px;width:52px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 4px var(--ink)" style-hover="background:rgba(198,143,102,.22)">
              <sc-if value="{{ showEmail }}" hint-placeholder-val="{{ true }}">
                <div style="position:relative;width:28px;height:20px;transform:scale(1.5)">
                  <div style="position:absolute;left:8px;top:0px;width:12px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:4px;top:4px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:0px;top:8px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:24px;top:8px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:20px;top:12px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:12px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:8px;top:4px;width:12px;height:12px;background:var(--field)"></div>
                  <div style="position:absolute;left:12px;top:8px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
              <sc-if value="{{ hideEmail }}" hint-placeholder-val="{{ false }}">
                <div style="position:relative;width:28px;height:20px;transform:scale(1.5)">
                  <div style="position:absolute;left:8px;top:0px;width:12px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:4px;top:4px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:0px;top:8px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:24px;top:8px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:20px;top:12px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:12px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:8px;top:4px;width:12px;height:12px;background:var(--field)"></div>
                  <div style="position:absolute;left:8px;top:8px;width:12px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--gold-hi);text-shadow:0 3px 0 rgba(0,0,0,.45)">PASSWORD</span>
          <div style="position:relative;display:flex">
            <input type="{{ passwordType }}" placeholder="••••••••" value="{{ password }}" onChange="{{ onPassword }}" style="width:100%;height:52px;padding:0 68px 0 16px;border:0;outline:0;background:var(--field);color:var(--text);font-family:'Silkscreen',monospace;font-size:19px;letter-spacing:2px;box-shadow:inset 0 0 0 4px var(--ink), inset 0 4px 0 8px rgba(0,0,0,.35), 0 0 0 4px var(--gold-mid)"></input>
            <div onClick="{{ toggleShowPassword }}" title="Show password" style="position:absolute;right:8px;top:8px;width:52px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 4px var(--ink)" style-hover="background:rgba(198,143,102,.22)">
              <sc-if value="{{ showPassword }}" hint-placeholder-val="{{ true }}">
                <div style="position:relative;width:28px;height:20px;transform:scale(1.5)">
                  <div style="position:absolute;left:8px;top:0px;width:12px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:4px;top:4px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:0px;top:8px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:24px;top:8px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:20px;top:12px;width:4px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:12px;height:4px;background:var(--gold)"></div>
                  <div style="position:absolute;left:8px;top:4px;width:12px;height:12px;background:var(--field)"></div>
                  <div style="position:absolute;left:12px;top:8px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
              <sc-if value="{{ hidePassword }}" hint-placeholder-val="{{ false }}">
                <div style="position:relative;width:28px;height:20px;transform:scale(1.5)">
                  <div style="position:absolute;left:8px;top:0px;width:12px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:4px;top:4px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:0px;top:8px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:24px;top:8px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:20px;top:12px;width:4px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:12px;height:4px;background:var(--gold-mid)"></div>
                  <div style="position:absolute;left:8px;top:4px;width:12px;height:12px;background:var(--field)"></div>
                  <div style="position:absolute;left:8px;top:8px;width:12px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px">
          <div onClick="{{ toggleEmail }}" style="display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none">
            <div style="position:relative;width:28px;height:28px;flex:none;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink), 0 0 0 4px var(--gold-mid)">
              <sc-if value="{{ rememberEmail }}" hint-placeholder-val="{{ true }}">
                <div style="position:absolute;inset:0">
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:12px;top:12px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:16px;top:8px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text)">Remember email</span>
          </div>

          <div onClick="{{ togglePassword }}" style="display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none">
            <div style="position:relative;width:28px;height:28px;flex:none;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink), 0 0 0 4px var(--gold-mid)">
              <sc-if value="{{ rememberPassword }}" hint-placeholder-val="{{ true }}">
                <div style="position:absolute;inset:0">
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:12px;top:12px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:16px;top:8px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text)">Remember password</span>
          </div>

          <div onClick="{{ toggleAutoLogin }}" style="display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none">
            <div style="position:relative;width:28px;height:28px;flex:none;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink), 0 0 0 4px var(--gold-mid)">
              <sc-if value="{{ autoLogin }}" hint-placeholder-val="{{ true }}">
                <div style="position:absolute;inset:0">
                  <div style="position:absolute;left:4px;top:12px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:8px;top:16px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:12px;top:12px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:16px;top:8px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:20px;top:4px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text)">Auto login</span>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
          <a href="#forgot-password" style="font-family:'Silkscreen',monospace;font-size:16px;border-bottom:3px solid var(--gold-dk)" style-hover="border-bottom-color:var(--gold-hi)">Forgot password?</a>
          <a href="#forgot-email" style="font-family:'Silkscreen',monospace;font-size:16px;border-bottom:3px solid var(--gold-dk)" style-hover="border-bottom-color:var(--gold-hi)">Forgot email?</a>
        </div>

        <div style="display:flex;flex-direction:column;gap:20px">
          <a href="#create-account" style="display:flex;align-items:center;justify-content:center;height:52px;font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--gold-hi);background:var(--panel-dk);box-shadow:inset 0 4px 0 rgba(255,255,255,.1), inset 0 -4px 0 rgba(0,0,0,.3), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-dk)" style-hover="background:#3b2823;color:#ffe3c0" style-active="transform:translateY(4px)">CREATE NEW ACCOUNT</a>

          <button onClick="{{ onSubmit }}" style="height:64px;border:0;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:15px;letter-spacing:2px;color:var(--ink);background:var(--gold);box-shadow:inset 0 5px 0 var(--gold-hi), inset 0 -5px 0 var(--gold-mid), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-dk), 0 12px 0 rgba(0,0,0,.3)" style-hover="background:var(--gold-hi)" style-active="transform:translateY(6px);box-shadow:inset 0 5px 0 var(--gold-hi), inset 0 -5px 0 var(--gold-mid), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-dk), 0 6px 0 rgba(0,0,0,.3)">LOGIN</button>
        </div>

      </div>
    </div>

    <!-- bottom pip -->
    <div style="position:absolute;bottom:-32px;left:calc(50% - 10px);transform:scale(1.5);transform-origin:50% 0;width:20px;height:20px">
      <div style="position:absolute;left:8px;top:0;width:4px;height:4px;background:var(--gold-mid)"></div>
      <div style="position:absolute;left:4px;top:4px;width:12px;height:4px;background:var(--gold)"></div>
      <div style="position:absolute;left:0;top:8px;width:20px;height:4px;background:var(--gold)"></div>
      <div style="position:absolute;left:4px;top:12px;width:12px;height:4px;background:var(--gold-mid)"></div>
      <div style="position:absolute;left:8px;top:16px;width:4px;height:4px;background:var(--gold-mid)"></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:880},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Royal blue&quot;,&quot;Forest&quot;,&quot;Crimson&quot;,&quot;Dusk&quot;],&quot;default&quot;:&quot;Royal blue&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;goldTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Gold&quot;,&quot;Silver&quot;],&quot;default&quot;:&quot;Gold&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { email: "", password: "", rememberEmail: true, rememberPassword: false, autoLogin: false, showEmail: false, showPassword: false };

  snapRef = React.createRef();

  snap = () => {
    const el = this.snapRef.current;
    if (!el) return;
    el.style.transform = "none";
    const l = el.getBoundingClientRect().left;
    const frac = l - Math.round(l);
    el.style.transform = frac ? "translateX(" + -frac + "px)" : "none";
  };

  componentWillUnmount() {
    window.removeEventListener("resize", this.snap);
  }

  componentDidMount() {
    this.snap();
    window.addEventListener("resize", this.snap);
    const tone = this.props.tone;
    const map = {
      "Royal blue": null,
      "Forest": { "--panel": "#1a2620", "--panel-hi": "#26362d", "--panel-dk": "#101711", "--field": "#0a100c" },
      "Crimson": { "--panel": "#2c1416", "--panel-hi": "#3e1e20", "--panel-dk": "#1a0c0d", "--field": "#120708" },
      "Dusk": { "--panel": "#1c2233", "--panel-hi": "#2a3247", "--panel-dk": "#111520", "--field": "#0b0e15" }
    };
    const vars = map[tone];
    if (vars) for (const k in vars) document.body.style.setProperty(k, vars[k]);
    if (this.props.goldTone === "Silver") {
      const s = { "--gold-hi": "#d7dde4", "--gold": "#a3adb8", "--gold-mid": "#737d88", "--gold-dk": "#3c4249", "--ink": "#000000" };
      for (const k in s) document.body.style.setProperty(k, s[k]);
    }
  }

  renderVals() {
    return {
      snapRef: this.snapRef,
      email: this.state.email,
      password: this.state.password,
      rememberEmail: this.state.rememberEmail,
      rememberPassword: this.state.rememberPassword,
      showEmail: this.state.showEmail,
      hideEmail: !this.state.showEmail,
      showPassword: this.state.showPassword,
      hidePassword: !this.state.showPassword,
      emailType: this.state.showEmail ? "text" : "password",
      passwordType: this.state.showPassword ? "text" : "password",
      toggleShowEmail: () => this.setState((s) => ({ showEmail: !s.showEmail })),
      toggleShowPassword: () => this.setState((s) => ({ showPassword: !s.showPassword })),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      toggleEmail: () => this.setState((s) => ({ rememberEmail: !s.rememberEmail })),
      togglePassword: () => this.setState((s) => ({ rememberPassword: !s.rememberPassword })),
      autoLogin: this.state.autoLogin,
      toggleAutoLogin: () => this.setState((s) => ({ autoLogin: !s.autoLogin })),
      onSubmit: () => {}
    };
  }
}
</script>
</body>
</html>
