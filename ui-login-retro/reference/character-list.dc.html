<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#080504;image-rendering:pixelated;-webkit-font-smoothing:none;font-smooth:never;
    --gold-hi:#ebbf90;--gold:#c68f66;--gold-mid:#9a6651;--gold-dk:#4e2f24;--ink:#000000;
    --panel:#231815;--panel-hi:#33231d;--panel-dk:#150e0c;--field:#0f0a09;
    --text:#ebbf90;--dim:#a87f68;}
  *{box-sizing:border-box}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-hi)}
  ::selection{background:var(--gold-mid);color:var(--ink)}
  *::-webkit-scrollbar{width:16px}
  *::-webkit-scrollbar-track{background:#0a0605;box-shadow:inset 4px 0 0 #000}
  *::-webkit-scrollbar-thumb{background:var(--gold-mid);border:4px solid #000;border-top-width:0;border-bottom-width:0}
  *::-webkit-scrollbar-thumb:hover{background:var(--gold)}
  *::-webkit-scrollbar-button{display:none}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:64px 32px;background:#080504;font-family:'Silkscreen',monospace">
  <div id="charlist-panel" ref="{{ snapRef }}" style="position:relative;width:1490px">
    <div style="position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 4px, rgba(0,0,0,0) 4px 8px)"></div>

    <div style="position:relative;background:var(--panel);box-shadow:0 0 0 4px var(--ink), 0 0 0 8px var(--gold-mid), 0 0 0 12px var(--gold-dk), 0 0 0 16px var(--ink), 0 24px 0 rgba(0,0,0,.45)">

      <div style="height:54px;display:flex;align-items:center;justify-content:center;background:var(--panel-hi);box-shadow:inset 0 4px 0 rgba(255,255,255,.05), inset 0 -4px 0 var(--ink)">
        <span style="font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:2px;color:var(--gold-hi);text-shadow:0 3px 0 rgba(0,0,0,.5)">SELECT CHARACTER</span>
      </div>

      <div style="padding:24px 32px 28px">

        <div style="display:flex;height:34px;background:var(--panel-dk);box-shadow:inset 0 0 0 4px var(--ink)">
          <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
            <div onClick="{{ col.sort }}" style="width:{{ col.width }};flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;cursor:pointer;box-shadow:inset -4px 0 0 var(--ink)" style-hover="background:rgba(198,143,102,.10)">
              <span style="font-family:'Silkscreen',monospace;font-size:17px;color:{{ col.color }};white-space:nowrap">{{ col.label }}</span>
              <div style="width:14px;height:8px;flex:none;position:relative">
                <sc-if value="{{ col.asc }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0">
                    <div style="position:absolute;left:4px;top:0;width:6px;height:2px;background:var(--gold-hi)"></div>
                    <div style="position:absolute;left:2px;top:2px;width:10px;height:2px;background:var(--gold-hi)"></div>
                    <div style="position:absolute;left:0;top:4px;width:14px;height:2px;background:var(--gold-hi)"></div>
                  </div>
                </sc-if>
                <sc-if value="{{ col.desc }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0">
                    <div style="position:absolute;left:0;top:0;width:14px;height:2px;background:var(--gold-hi)"></div>
                    <div style="position:absolute;left:2px;top:2px;width:10px;height:2px;background:var(--gold-hi)"></div>
                    <div style="position:absolute;left:4px;top:4px;width:6px;height:2px;background:var(--gold-hi)"></div>
                  </div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="position:relative;margin-top:4px;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink), 0 0 0 4px var(--gold-mid)">
          <div style="height:556px;overflow-y:auto;padding:4px">
            <sc-for list="{{ rows }}" as="row" hint-placeholder-count="5">
              <div onClick="{{ row.select }}" onDoubleClick="{{ enterGame }}" style="position:relative;display:flex;align-items:stretch;height:{{ row.height }};cursor:pointer" style-hover="background:rgba(198,143,102,.10)">
                <sc-if value="{{ row.selected }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 0 4px var(--gold);background:rgba(198,143,102,.14)"></div>
                </sc-if>

                <div style="width:554px;flex:none;display:flex;align-items:center;gap:14px;padding-left:8px;box-shadow:inset -4px 0 0 rgba(0,0,0,.6)">
                  <sc-if value="{{ showOutfits }}" hint-placeholder-val="{{ true }}">
                    <div style="width:124px;height:124px;flex:none;background:var(--panel-dk);box-shadow:inset 0 0 0 4px var(--ink)"></div>
                  </sc-if>
                  <div style="display:flex;align-items:center;gap:10px;min-width:0">
                    <span style="font-family:'Silkscreen',monospace;font-size:20px;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ row.name }}</span>
                    <sc-if value="{{ row.main }}" hint-placeholder-val="{{ false }}">
                      <div style="width:18px;height:16px;flex:none;position:relative">
                        <div style="position:absolute;left:6px;top:0;width:6px;height:4px;background:var(--gold-hi)"></div>
                        <div style="position:absolute;left:0;top:4px;width:18px;height:4px;background:var(--gold-hi)"></div>
                        <div style="position:absolute;left:4px;top:8px;width:10px;height:4px;background:var(--gold)"></div>
                        <div style="position:absolute;left:6px;top:12px;width:6px;height:4px;background:var(--gold-mid)"></div>
                      </div>
                    </sc-if>
                  </div>
                  <div onClick="{{ row.pin }}" title="Pin this character" style="width:24px;height:24px;flex:none;margin-left:auto;margin-right:12px;position:relative;opacity:{{ row.pinOpacity }}">
                    <div style="position:absolute;left:8px;top:0;width:8px;height:4px;background:var(--gold)"></div>
                    <div style="position:absolute;left:4px;top:4px;width:16px;height:4px;background:var(--gold)"></div>
                    <div style="position:absolute;left:8px;top:8px;width:8px;height:16px;background:var(--gold-mid)"></div>
                  </div>
                </div>

                <div style="width:106px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset -4px 0 0 rgba(0,0,0,.6)">
                  <sc-if value="{{ row.dailyReward }}" hint-placeholder-val="{{ true }}">
                    <div style="width:22px;height:38px;position:relative">
                      <div style="position:absolute;left:0;top:6px;width:22px;height:26px;background:var(--gold-dk);box-shadow:inset 0 0 0 2px var(--ink)"></div>
                      <div style="position:absolute;left:8px;top:0;width:6px;height:8px;background:var(--gold-hi)"></div>
                      <div style="position:absolute;left:8px;top:12px;width:6px;height:14px;background:var(--gold-hi)"></div>
                    </div>
                  </sc-if>
                  <sc-if value="{{ row.hidden }}" hint-placeholder-val="{{ false }}">
                    <div style="width:22px;height:38px;position:relative">
                      <div style="position:absolute;left:2px;top:12px;width:18px;height:4px;background:var(--dim)"></div>
                      <div style="position:absolute;left:0;top:16px;width:22px;height:4px;background:var(--dim)"></div>
                      <div style="position:absolute;left:2px;top:20px;width:18px;height:4px;background:var(--dim)"></div>
                    </div>
                  </sc-if>
                </div>

                <div style="width:96px;flex:none;display:flex;align-items:center;padding:0 10px;box-shadow:inset -4px 0 0 rgba(0,0,0,.6)">
                  <span style="font-family:'Silkscreen',monospace;font-size:19px;color:var(--text)">{{ row.level }}</span>
                </div>

                <div style="width:226px;flex:none;display:flex;align-items:center;padding:0 10px;box-shadow:inset -4px 0 0 rgba(0,0,0,.6)">
                  <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ row.vocation }}</span>
                </div>

                <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 10px;min-width:0">
                  <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text)">{{ row.world }}</span>
                  <span style="font-family:'Silkscreen',monospace;font-size:15px;color:var(--dim)">{{ row.worldHost }}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;margin-top:26px">
          <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--dim)">Account Status:</span>
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:44px;height:40px;flex:none;position:relative;background:var(--panel-dk);box-shadow:inset 0 0 0 4px var(--ink)">
              <div style="position:absolute;left:12px;top:10px;width:20px;height:4px;background:var(--gold-hi)"></div>
              <div style="position:absolute;left:8px;top:14px;width:28px;height:4px;background:var(--gold)"></div>
              <div style="position:absolute;left:12px;top:18px;width:20px;height:4px;background:var(--gold)"></div>
              <div style="position:absolute;left:16px;top:22px;width:12px;height:4px;background:var(--gold-mid)"></div>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:19px;color:{{ accountColor }}">{{ accountLabel }}</span>
          </div>
        </div>

        <div style="height:4px;margin:26px 0;background:var(--ink);box-shadow:0 4px 0 var(--panel-hi)"></div>

        <div style="display:flex;align-items:center;gap:20px">
          <div onClick="{{ toggleHidden }}" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink);cursor:not-allowed;opacity:.45">
            <div style="position:relative;width:24px;height:24px;flex:none;background:var(--panel-dk);box-shadow:inset 0 0 0 4px var(--ink)">
              <div style="position:absolute;left:2px;top:10px;width:4px;height:4px;background:var(--gold-hi)"></div>
              <div style="position:absolute;left:6px;top:14px;width:4px;height:4px;background:var(--gold-hi)"></div>
              <div style="position:absolute;left:10px;top:10px;width:4px;height:4px;background:var(--gold-hi)"></div>
              <div style="position:absolute;left:14px;top:6px;width:4px;height:4px;background:var(--gold-hi)"></div>
              <div style="position:absolute;left:18px;top:2px;width:4px;height:4px;background:var(--gold-hi)"></div>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text);white-space:nowrap">Show Hidden Characters</span>
          </div>

          <div onClick="{{ toggleOutfits }}" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink);cursor:pointer" style-hover="background:#160f0d">
            <div style="position:relative;width:24px;height:24px;flex:none;background:var(--panel-dk);box-shadow:inset 0 0 0 4px var(--ink)">
              <sc-if value="{{ showOutfits }}" hint-placeholder-val="{{ true }}">
                <div style="position:absolute;inset:0">
                  <div style="position:absolute;left:2px;top:10px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:6px;top:14px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:10px;top:10px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:14px;top:6px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:18px;top:2px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text);white-space:nowrap">Show Outfit</span>
          </div>

          <div onClick="{{ toggleRecord }}" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;background:var(--field);box-shadow:inset 0 0 0 4px var(--ink);cursor:pointer" style-hover="background:#160f0d">
            <div style="position:relative;width:24px;height:24px;flex:none;background:var(--panel-dk);box-shadow:inset 0 0 0 4px var(--ink)">
              <sc-if value="{{ recordSession }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;inset:0">
                  <div style="position:absolute;left:2px;top:10px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:6px;top:14px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:10px;top:10px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:14px;top:6px;width:4px;height:4px;background:var(--gold-hi)"></div>
                  <div style="position:absolute;left:18px;top:2px;width:4px;height:4px;background:var(--gold-hi)"></div>
                </div>
              </sc-if>
            </div>
            <span style="font-family:'Silkscreen',monospace;font-size:17px;color:var(--text);white-space:nowrap">Record Session</span>
          </div>

          <div style="margin-left:auto;display:flex;gap:20px">
            <button onClick="{{ enterGame }}" style="width:150px;height:44px;border:0;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:1px;color:var(--ink);background:var(--gold);box-shadow:inset 0 4px 0 var(--gold-hi), inset 0 -4px 0 var(--gold-mid), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-dk), 0 8px 0 rgba(0,0,0,.35)" style-hover="background:var(--gold-hi)" style-active="transform:translateY(4px);box-shadow:inset 0 4px 0 var(--gold-hi), inset 0 -4px 0 var(--gold-mid), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-dk), 0 4px 0 rgba(0,0,0,.35)">OK</button>
            <button onClick="{{ onCancel }}" style="width:150px;height:44px;border:0;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:1px;color:var(--gold-hi);background:var(--panel-dk);box-shadow:inset 0 4px 0 rgba(255,255,255,.08), inset 0 -4px 0 rgba(0,0,0,.35), 0 0 0 4px var(--ink), 0 0 0 8px var(--gold-dk)" style-hover="background:#3b2823;color:#ffe3c0" style-active="transform:translateY(4px)">CANCEL</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1580,&quot;height&quot;:1020},&quot;goldTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Gold&quot;,&quot;Silver&quot;],&quot;default&quot;:&quot;Gold&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;premiumDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:47,&quot;min&quot;:0,&quot;max&quot;:365,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Account&quot;}}">
class Component extends DCLogic {
  state = { selected: 0, showOutfits: true, recordSession: false, sortKey: "character", sortAsc: true, pinned: {} };
  snapRef = React.createRef();

  characters = [
    { name: "Sir Aldwyn", level: 142, vocation: "Elder Druid", world: "Backlands", host: "(backlands.net)", main: true, dailyReward: true, hidden: false },
    { name: "Grimhold", level: 98, vocation: "Master Sorcerer", world: "Backlands", host: "(backlands.net)", main: false, dailyReward: true, hidden: false },
    { name: "Vela Nightbow", level: 76, vocation: "Royal Paladin", world: "Backlands", host: "(backlands.net)", main: false, dailyReward: false, hidden: true },
    { name: "Torrick", level: 41, vocation: "Elite Knight", world: "Outlands", host: "(outlands.net)", main: false, dailyReward: true, hidden: false },
    { name: "Mundy", level: 8, vocation: "None", world: "Outlands", host: "(outlands.net)", main: false, dailyReward: false, hidden: false }
  ];

  snap = () => {
    const el = this.snapRef.current;
    if (!el) return;
    el.style.transform = "none";
    const l = el.getBoundingClientRect().left;
    const frac = l - Math.round(l);
    el.style.transform = frac ? "translateX(" + -frac + "px)" : "none";
  };

  componentDidMount() {
    this.snap();
    window.addEventListener("resize", this.snap);
    if (this.props.goldTone === "Silver") {
      const s = { "--gold-hi": "#d7dde4", "--gold": "#a3adb8", "--gold-mid": "#737d88", "--gold-dk": "#3c4249", "--text": "#d7dde4", "--dim": "#9aa4ae" };
      for (const k in s) document.body.style.setProperty(k, s[k]);
    }
  }

  componentWillUnmount() {
    window.removeEventListener("resize", this.snap);
  }

  sortBy(key) {
    this.setState(s => ({ sortKey: key, sortAsc: s.sortKey === key ? !s.sortAsc : true }));
  }

  renderVals() {
    const { sortKey, sortAsc, showOutfits, pinned } = this.state;
    const premium = (this.props.premiumDays ?? 47) > 0;
    const showOutfitRows = showOutfits;

    const cols = [
      { key: "character", label: "Character", width: "554px" },
      { key: "status", label: "Status", width: "106px" },
      { key: "level", label: "Level", width: "96px" },
      { key: "vocation", label: "Vocation", width: "226px" },
      { key: "world", label: "World", width: "444px" }
    ];

    const pick = (c) => ({ character: c.name, status: c.dailyReward ? 1 : 0, level: c.level, vocation: c.vocation, world: c.world }[sortKey]);
    const list = this.characters
      .map((c, i) => ({ c, i }))
      .sort((a, b) => {
        const pa = pinned[a.i] ? 0 : 1, pb = pinned[b.i] ? 0 : 1;
        if (pa !== pb) return pa - pb;
        const va = pick(a.c), vb = pick(b.c);
        const cmp = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
        return sortAsc ? cmp : -cmp;
      });

    return {
      snapRef: this.snapRef,
      showOutfits: showOutfitRows,
      recordSession: this.state.recordSession,
      accountLabel: premium ? "Premium Account" : "Free Account",
      accountColor: premium ? "var(--gold-hi)" : "var(--dim)",
      columns: cols.map(col => ({
        label: col.label,
        width: col.width,
        color: sortKey === col.key ? "var(--gold-hi)" : "var(--dim)",
        asc: sortKey === col.key && sortAsc,
        desc: sortKey === col.key && !sortAsc,
        sort: () => this.sortBy(col.key)
      })),
      rows: list.map(({ c, i }) => ({
        name: c.name,
        level: String(c.level),
        vocation: c.vocation.toUpperCase(),
        world: c.world,
        worldHost: c.host,
        main: c.main,
        dailyReward: c.dailyReward,
        hidden: c.hidden,
        height: showOutfitRows ? "132px" : "58px",
        selected: this.state.selected === i,
        pinOpacity: pinned[i] ? "1" : (this.state.selected === i ? "0.5" : "0"),
        select: () => this.setState({ selected: i }),
        pin: (e) => { e.stopPropagation(); this.setState(s => ({ pinned: Object.assign({}, s.pinned, { [i]: !s.pinned[i] }) })); }
      })),
      toggleOutfits: () => this.setState(s => ({ showOutfits: !s.showOutfits })),
      toggleRecord: () => this.setState(s => ({ recordSession: !s.recordSession })),
      toggleHidden: () => {},
      enterGame: () => {},
      onCancel: () => {}
    };
  }
}
</script>
</body>
</html>
